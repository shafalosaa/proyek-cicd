name: Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run HTMLHint
        run: npx htmlhint index.html

      - name: Run ESLint
        run: npx eslint@8 script.js --env browser

  build-and-push:
    needs: test # Hanya berjalan jika job testing BERHASIL
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Hanya push saat push ke branch main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop old container
        shell: powershell
        continue-on-error: true
        run: |
          docker stop web-app
          docker rm web-app

      - name: Deploy container
        shell: powershell
        run: |
          docker pull ghcr.io/${{ github.repository }}:latest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker run -d --name web-app -p ${{ secrets.APP_PORT }}:80 ghcr.io/${{ github.repository }}:latest
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Health check
        shell: powershell
        run: |
          Start-Sleep -Seconds 3
          curl.exe -f http://localhost:${{ secrets.APP_PORT }}
          if ($LASTEXITCODE -ne 0) { exit 1 }